# Points Grafana at the dashboard JSON files so they load automatically on
# startup instead of needing to be imported by hand through the UI.
apiVersion: 1

providers:
  - name: finance-platform
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
